---
title: "Développer mon jeu Java avec le JDK 23"
author: "Frédéric Delorme"
created: 20-JAN-2025
extends: base
documentclass: book
book: true
classoption: oneside
top-level-division: chapter
numbersections: true
output:
  pdf_document:
    keep_tex: true
    toc: true
    toc_depth: 6
    highlight: "zenburn"
    number_sections: true
    pandoc_args: ["--top-level-division=chapter"]
    template: eisvogel
header-includes:
- \renewcommand{\chaptername}{}
- \renewcommand{\thechapter}{}
- \usepackage{titlesec}
- \newcommand{\sectionbreak}{\clearpage}
- \usepackage{titling}
- \usepackage{pdfpages}
#- \pretitle{\begin{center}\includepdf{cover.pdf}}
#- \posttitle{\end{center}}
page:
  layout: portrait
  margin: [1cm, 1.5cm, 1cm, 1.5cm]
  size: A4
base:
  font-color: #333333
  font-family: Times-Roman
  font-size: 12
  line-height-length: 17
  line-height: $base-line-height-length / $base-font-size
role:
  removed:
    font-style: italic
    text-decoration: line-through
    text-decoration-color: #FF0000
heading:
  font-color: #262626
  font-size: 17
  font-style: bold
  line-height: 1.2
  margin-bottom: 10
link:
  font-color: #002FA7
list:
  indent: $base-font-size * 1.5
---

